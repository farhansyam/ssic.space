<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline · SSIC</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(135deg, #e0f2fe, #fef3c7); color: #1e293b; }
        .card { text-align: center; padding: 2.5rem; max-width: 24rem; }
        .icon { width: 4rem; height: 4rem; margin: 0 auto 1rem; border-radius: 1.25rem; background: linear-gradient(135deg, #38bdf8, #0284c7); display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 1.5rem; }
        h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
        p { color: #64748b; font-size: 0.9rem; line-height: 1.5; margin: 0 0 1.5rem; }
        button { background: linear-gradient(135deg, #38bdf8, #0284c7); color: white; border: none; padding: 0.65rem 1.5rem; border-radius: 0.75rem; font-size: 0.9rem; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">S</div>
        <h1>Kamu sedang offline</h1>
        <p>Koneksi internet terputus. Cek kembali koneksimu lalu coba muat ulang halaman ini.</p>
        <button onclick="location.reload()">Muat Ulang</button>
    </div>
</body>
</html>
